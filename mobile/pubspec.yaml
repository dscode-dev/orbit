name: orbit_operator
description: Orbit Operator — aplicativo de campo do Orbit Operations ERP.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegação
  go_router: ^14.6.2

  # Rede
  dio: ^5.7.0

  # Armazenamento
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3

  # Captura de evidências
  image_picker: ^1.1.2
  file_picker: ^10.0.0

  # Localização
  geolocator: ^13.0.2

  # Fila de uploads (persistência e rede)
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.0

  # Hash de evidências (SHA-256 sobre os bytes exatos enviados)
  crypto: ^3.0.6

  # Utilidades
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
