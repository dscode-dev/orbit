name: orbit

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - orbit_private
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner
    image: orbit-api:${ORBIT_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 5001
      HOST: ${API_HOST:-0.0.0.0}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-orbit-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-orbit}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      ENCRYPTION_KEY_VERSION: ${ENCRYPTION_KEY_VERSION:-1}
      OPERATION_UPLOAD_DIR: /app/storage/operations
      DOCUMENT_STORAGE_DIR: /app/storage/documents
      # Objetos do Storage Provider (PR-19). Sem volume, os documentos emitidos
      # morrem no primeiro rebuild da imagem — o manifest continua apontando
      # para um arquivo que não existe mais.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-LOCAL}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-orbit-artifacts}
      STORAGE_LOCAL_DIR: /app/storage/objects
      STORAGE_LOCAL_PUBLIC_URL: ${STORAGE_LOCAL_PUBLIC_URL:-http://localhost:5001/api/v1}
      STORAGE_SIGNED_URL_TTL_SECONDS: ${STORAGE_SIGNED_URL_TTL_SECONDS:-300}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAIL_FROM: ${EMAIL_FROM:-Orbit <no-reply@orbit.local>}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@orbit.local}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:?PLATFORM_ADMIN_EMAIL is required}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?PLATFORM_ADMIN_PASSWORD is required}
      PLATFORM_ADMIN_FIRST_NAME: ${PLATFORM_ADMIN_FIRST_NAME:?PLATFORM_ADMIN_FIRST_NAME is required}
      PLATFORM_ADMIN_LAST_NAME: ${PLATFORM_ADMIN_LAST_NAME:?PLATFORM_ADMIN_LAST_NAME is required}
    ports:
      - "0.0.0.0:${API_PORT:-5001}:5001"
    volumes:
      - operation_attachments:/app/storage/operations
      - generated_documents:/app/storage/documents
      - artifact_objects:/app/storage/objects
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_private
      - orbit_public
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: migrator
    image: orbit-api-migrator:${ORBIT_VERSION:-latest}
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orbit_private
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    image: orbit-frontend:${ORBIT_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      ORBIT_API_URL: http://api:5001/api/v1
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - orbit_public
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  operation_attachments:
  generated_documents:
  artifact_objects:

networks:
  orbit_private:
    internal: true
  orbit_public:
